<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simuladores de AED</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
 --bg:light-dark(#f6f7f9,#0e1522);--card:light-dark(#fff,#16202f);--ink:light-dark(#18202b,#e6ebf2);--mute:light-dark(#5b6573,#9aa6b6);
 --navy:#0b2d5b;--navyink:light-dark(#0b2d5b,#a9c3e8);--gold:#c9a227;--line:light-dark(#d9dfe8,#2a3647);
 --no:light-dark(#e8eef7,#1d2c44);--noborda:light-dark(#0b2d5b,#7fa3d6);--lar:#d9822b;--larcl:light-dark(#fcebd9,#3a2a16)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Source Sans 3",system-ui,sans-serif}
header{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold);padding:28px max(5vw,18px)}
header h1{margin:0;font-size:clamp(28px,4vw,40px);line-height:1.1}
header p{margin:8px 0 0;color:#c8d6ea;max-width:62ch}
main{max-width:1100px;margin:auto;padding:28px max(5vw,18px) 48px}
h2{font-size:20px;color:var(--navyink);margin:0 0 14px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:18px}
a.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
 color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s,border-color .15s}
a.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(11,45,91,.14);border-color:var(--navyink)}
a.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.fig{background:light-dark(#f3f5f8,#101826);border-bottom:1px solid var(--line);padding:14px;display:grid;place-items:center}
.fig svg{width:100%;max-width:280px;height:auto}
.txt{padding:14px 16px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.txt h3{margin:0;font-size:20px;color:var(--navyink)}
.txt p{margin:0;color:var(--mute);font-size:16px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tags span{font-size:13px;padding:2px 9px;border-radius:12px;background:var(--no);color:var(--navyink)}
.abrir{margin-top:auto;padding-top:10px;font-weight:700;color:var(--navyink)}
footer{max-width:1100px;margin:auto;padding:0 max(5vw,18px) 32px;color:var(--mute);font-size:15px}
@media(prefers-reduced-motion:reduce){a.card{transition:none}a.card:hover{transform:none}}
</style>
</head>
<body>
<header>
  <h1>Simuladores de Algoritmos e Estruturas de Dados</h1>
  <p>PUC Minas · Prof. Rodrigo Richard Gomes. Escolha um simulador para acompanhar, passo a passo, o código visto em aula.</p>
</header>
<main>
  <h2>Simuladores disponíveis</h2>
  <div class="grade" id="grade"></div>
</main>
<footer>Algoritmos e Estruturas de Dados · PUC Minas</footer>
<script>
{
// Para acrescentar um simulador, copie um item desta lista e ajuste os campos.
// "arquivo" é o caminho do .html em relação a este main.html.
const SIMULADORES = [
  {
    titulo: 'Árvore Binária de Pesquisa',
    descricao: 'Inserção, pesquisa, remoção, caminhamentos, mínimo e máximo, com o código da classe ArvoreBinaria, a pilha de execução e as referências desenhadas.',
    arquivo: 'simulador-abp.html',
    tags: ['Unidade VII', 'C#', 'recursão'],
    figura: 'abp'
  },
  {
    titulo: 'Fila encadeada (CFila)',
    descricao: 'Teste de mesa de um programa que usa a CFila<int>: Enfileira, Desenfileira, Peek, Contem e foreach, com a pilha de execução, o heap, a célula cabeça e perguntas para pensar durante a execução.',
    arquivo: 'simulador-fila.html',
    tags: ['estruturas encadeadas', 'C#', 'fila'],
    figura: 'fila'
  },
  {
    titulo: 'Quicksort',
    descricao: 'O Quicksort linha a linha, em C, Java, C# ou Python, com partição de Hoare, Lomuto ou Sedgewick e escolha do tamanho e da ordem inicial do vetor e do pivô (meio, primeiro, último, mediana de três ou aleatório): o vetor com i, j, esq e dir, as comparações com o pivô, as trocas animadas, a pilha de chamadas e a árvore de recursão.',
    arquivo: 'simulador-quicksort.html',
    tags: ['ordenação', 'C · Java · C# · Python', 'recursão'],
    figura: 'quick'
  },
  {
    titulo: 'Árvore AVL',
    descricao: 'Inserção, remoção e pesquisa numa AVL, em C, C++, Java ou C#: a altura e o fator de balanceamento de cada nó, o Balancear conferindo cada nó na volta da recursão, as rotações simples e duplas acontecendo na tela, com o nome de cada rotação e o motivo de ela ser aplicada, a pilha de execução e quem recebe cada retorno. O fator pode ser calculado como altura(esq) − altura(dir) ou o contrário. Inclui casos prontos para cada tipo de rotação.',
    arquivo: 'simulador-avl.html',
    tags: ['árvores balanceadas', 'C · C++ · Java · C#', 'rotações'],
    figura: 'avl'
  }
];

const FIGURAS = {
  abp: `<svg viewBox="0 0 280 150" role="img" aria-label="Desenho de uma árvore binária de pesquisa">
    <g stroke="var(--noborda)" stroke-width="2">
      <line x1="140" y1="28" x2="80" y2="72"/><line x1="140" y1="28" x2="200" y2="72"/>
      <line x1="80" y1="72" x2="50" y2="118"/><line x1="80" y1="72" x2="110" y2="118"/>
      <line x1="200" y1="72" x2="170" y2="118"/>
    </g>
    <line x1="200" y1="72" x2="230" y2="118" stroke="var(--lar)" stroke-width="3.5"/>
    <line x1="140" y1="28" x2="200" y2="72" stroke="var(--lar)" stroke-width="3.5"/>
    <g font-family="Source Sans 3,sans-serif" font-weight="700" font-size="14" text-anchor="middle">
      ${[[140,28,50,'c'],[80,72,30],[200,72,70,'c'],[50,118,20],[110,118,40],[170,118,60],[230,118,80,'n']].map(([x,y,v,e]) =>
        `<circle cx="${x}" cy="${y}" r="17" fill="${e==='n'?'var(--lar)':e==='c'?'var(--larcl)':'var(--no)'}" stroke="${e?'var(--lar)':'var(--noborda)'}" stroke-width="2.2"/>
         <text x="${x}" y="${y+5}" fill="${e==='n'?'#fff':'var(--ink)'}">${v}</text>`).join('')}
    </g>
  </svg>`,
  fila: `<svg viewBox="0 0 280 150" role="img" aria-label="Desenho de uma fila encadeada com célula cabeça">
    <defs><marker id="fm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--noborda)"/></marker></defs>
    <g font-family="JetBrains Mono,monospace" font-size="12">
      <text x="20" y="26" fill="var(--ink)">Frente</text><text x="206" y="26" fill="var(--ink)">Tras</text>
      <path d="M40 32 Q40 56 38 70" stroke="var(--noborda)" stroke-width="2" fill="none" marker-end="url(#fm)"/>
      <path d="M222 32 Q226 56 236 70" stroke="var(--noborda)" stroke-width="2" fill="none" marker-end="url(#fm)"/>
      ${[[14,'0',true],[96,'2'],[178,'19']].map(([x,v,cab],k)=>`
        <rect x="${x}" y="74" width="40" height="30" fill="${cab?'var(--line)':'var(--card)'}" stroke="var(--noborda)" stroke-width="2"/>
        <rect x="${x+40}" y="74" width="28" height="30" fill="var(--no)" stroke="var(--noborda)" stroke-width="2"/>
        <text x="${x+20}" y="94" text-anchor="middle" fill="${cab?'var(--mute)':'var(--ink)'}">${v}</text>
        <circle cx="${x+54}" cy="89" r="3" fill="var(--noborda)"/>
        ${k<2?`<line x1="${x+54}" y1="89" x2="${x+80}" y2="89" stroke="var(--noborda)" stroke-width="2" marker-end="url(#fm)"/>`:`<path d="M${x+54} 89v20m-8 0h16m-11 4h6" stroke="var(--noborda)" stroke-width="2" fill="none"/>`}`).join('')}
      <text x="34" y="128" text-anchor="middle" font-family="Source Sans 3,sans-serif" font-weight="700" font-size="11" fill="var(--lar)">cabeça</text>
    </g>
  </svg>`,
  avl: `<svg viewBox="0 0 280 150" role="img" aria-label="Rotação simples à direita numa árvore AVL">
    <defs><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--verde, #2e7d4f)"/></marker></defs>
    <g stroke="var(--noborda)" stroke-width="2"><line x1="70" y1="30" x2="45" y2="75"/><line x1="45" y1="75" x2="22" y2="120"/>
      <line x1="215" y1="48" x2="180" y2="100"/><line x1="215" y1="48" x2="250" y2="100"/></g>
    <path d="M110 75Q140 55 165 75" fill="none" stroke="var(--verde, #2e7d4f)" stroke-width="2.6" marker-end="url(#am)"/>
    <g font-family="Source Sans 3,sans-serif" font-weight="700" font-size="14" text-anchor="middle">
      ${[[70,30,30,'d'],[45,75,20,'j'],[22,120,10],[215,48,20,'j'],[180,100,10],[250,100,30]].map(([x,y,v,e]) =>
        `<circle cx="${x}" cy="${y}" r="17" fill="${e==='d'?'var(--vermcl, #fcedec)':e==='j'?'var(--roxocl, #eee6f7)':'var(--no)'}" stroke="${e==='d'?'var(--verm, #b3261e)':e==='j'?'var(--roxo, #6b3fa0)':'var(--noborda)'}" stroke-width="${e?3:2.2}"/>
         <text x="${x}" y="${y+5}" fill="var(--ink)">${v}</text>`).join('')}
    </g>
    <g font-family="JetBrains Mono,monospace" font-size="11" font-weight="700">
      <rect x="84" y="12" width="24" height="16" rx="8" fill="var(--verm, #b3261e)"/><text x="96" y="24" text-anchor="middle" fill="#fff">+2</text>
      <text x="138" y="50" text-anchor="middle" fill="var(--verde, #2e7d4f)">rotação</text>
    </g>
  </svg>`,
  quick: `<svg viewBox="0 0 280 150" role="img" aria-label="Barras de um vetor sendo ordenado, com o pivô">
    <line x1="18" y1="62" x2="262" y2="62" stroke="var(--gold)" stroke-width="2" stroke-dasharray="6 4"/>
    ${[3,6,2,8,5,9,4,7].map((v,k)=>{const h=v*10, x=22+k*30, cor=k===4?'var(--gold)':(k===1||k===6)?'var(--lar)':'var(--noborda)';
      return `<rect x="${x}" y="${112-h}" width="22" height="${h}" rx="3" fill="${cor}" opacity="${k===4?1:.75}"/><text x="${x+11}" y="128" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="12" fill="var(--ink)">${v}</text>`}).join('')}
    <text x="63" y="146" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="700" font-size="12" fill="var(--lar)">i</text>
    <text x="213" y="146" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="700" font-size="12" fill="var(--roxo, #6b3fa0)">j</text>
    <text x="22" y="56" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" fill="var(--gold)">pivô</text>
  </svg>`
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
document.getElementById('grade').innerHTML = SIMULADORES.map(s => `
  <a class="card" href="${esc(s.arquivo)}">
    <div class="fig">${FIGURAS[s.figura] || ''}</div>
    <div class="txt">
      <h3>${esc(s.titulo)}</h3>
      <p>${esc(s.descricao)}</p>
      <div class="tags">${s.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>
      <span class="abrir">Abrir simulador →</span>
    </div>
  </a>`).join('');
}
</script>
</body>
</html>
